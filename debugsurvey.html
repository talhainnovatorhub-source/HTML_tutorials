<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>debug</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .parent{
            height: 100vh;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
        /* d1 styling */
        .d1{
            width: 200px;
            height: 200px;
            background-color: antiquewhite;
            border: 3px solid black;
            /* border-color: blue; */
            border-radius: 5px;
            transition: all 2s ease 2s;
        }
        .d1 img{
            width: 195px;
            height: 150px;
        }

        /* d2 styling */
        .d2{
            width: 200px;
            height: 200px;
            text-align: center;
            font-weight: bolder;
            border: 3px solid black;
            border-radius: 5px;
            background-color: brown;

        }
        /* d3 styling */
        .d3{
            width: 200px;
            height: 200px;
            border: 3px solid black;
            border-radius: 5px;

        }
        .d3 img{
            width: 195px;
            height: 195px;
        }
        /* d4 styling */
        .d4{
            width: 200px;
            height: 200px;
            border: 3px solid black;
            border-radius: 5px;
        }
        .d4 video{
            width: 195px;
            height: 195px;
        }
    </style>
</head>

<body>

   <div class="parent">
     <!-- first div -->
    <div class="d1">
        <img src="my photo.jpg">
        <center>
            <h1>Talha Hasan</h1>
        </center>
    </div>

    <!-- second div -->
     <div class="d2">Hasan</div>

    <!-- third div -->
      <div class="d3"><img src="My pic 1.jpg" alt=""></div>

    <!-- forth div -->
       <div class="d4"><video src="my video.mp4" controls="auto"></video></div>
   </div>
</body>

</html>
